# Al-Ahed Holding: /etc/nginx/sites-available/alahed (installed by deploy/server-setup.sh)
# Certificate issued with: certbot certonly --webroot -w /var/www/certbot -d __DOMAIN__
# Rate limit for public forms and the admin sign-in (per client IP).
limit_req_zone $binary_remote_addr zone=alahed_forms:10m rate=10r/m;

upstream alahed_app {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 (enabled 2026-11-23 with the owner's OK). nginx 1.24 applies it to the whole shared :443 socket, so it
    # also covers the other sites on the droplet; nginx >= 1.25.1 would use `http2 on;` per server instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CV uploads (20 MB) + IR documents.
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Temporary domain: keep the preview out of search engines. Remove when moving to the real domain.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Public forms + admin sign-in: 10/min per IP with a small burst, then 429.
    location ~ ^/(api/(contact|careers|subscribe)|(en|ar)/admin/login) {
        limit_req zone=alahed_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://alahed_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://alahed_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
